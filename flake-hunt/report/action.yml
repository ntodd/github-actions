name: flake-hunt report
description: Opens, comments on or reopens an issue per flaky test, and writes the job summary.
inputs:
  triage:
    description: The directory holding triage.json.
    required: true
  diagnoses:
    description: The directory holding Claude's answers, if any.
    default: ""
  label:
    description: The label that marks flake-hunt's issues.
    default: flaky-test
  dry-run:
    description: auto (a dry run unless this is the default branch), always or never.
    default: auto
  agent-workflow:
    description: An agent-ready caller workflow in this repo, like agent-ready.yml. The new and reopened issues are grouped by likely cause, and each group's first issue gets agent-label and a run of it. The token needs actions write.
    default: ""
  agent-label:
    description: The label agent-ready starts on.
    default: agent-ready
  token:
    description: Writes the issues, and starts agent-workflow.
    default: ${{ github.token }}
runs:
  using: node24
  main: index.mjs
