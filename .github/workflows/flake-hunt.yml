name: Flake hunt

# Runs a Mix project's suite many times, finds the tests that fail some
# runs but not all, and files an issue for each. See flake-hunt/README.md.
#
#   plan      checks the inputs, picks the Elixir and OTP versions
#   hunt      one job per shard: runs the suite runs-per-shard times
#   triage    finds the flakes, matches them to issues, writes prompts
#   diagnose  Claude, for new flakes, with a read-only token
#   report    opens, comments on or reopens the issues
#
# The jobs check out this repo at job.workflow_sha, the commit the caller
# pinned, and use its actions from there.

on:
  workflow_call:
    inputs:
      working-directory:
        description: The Mix project's directory, relative to the repo root.
        type: string
        default: "."
      id:
        description: Names this hunt's artifacts. Set it if one workflow hunts the same directory twice.
        type: string
        default: ""
      runs-on:
        description: The runner label for every job.
        type: string
        default: crew-m
      shards:
        description: How many jobs run the suite in parallel, 1 to 50.
        type: number
        default: 4
      runs-per-shard:
        description: How many times each shard runs the suite.
        type: number
        default: 25
      elixir-version:
        description: Defaults to mise.toml or .tool-versions, in the project's directory or the repo root.
        type: string
        default: ""
      otp-version:
        description: Defaults to mise.toml or .tool-versions, in the project's directory or the repo root.
        type: string
        default: ""
      node-version:
        description: Installs Node for suites that need it.
        type: string
        default: ""
      go-version:
        description: Installs Go for suites that need it.
        type: string
        default: ""
      setup:
        description: Bash, run in the project's directory before deps.get, in the hunt and diagnose jobs. Append to $GITHUB_ENV to set variables for the tests.
        type: string
        default: ""
      test-args:
        description: Extra mix test arguments.
        type: string
        default: ""
      label:
        description: The label on flake-hunt's issues.
        type: string
        default: flaky-test
      max-diagnoses:
        description: The most new flakes to send to Claude in one hunt.
        type: number
        default: 3
      claude-model:
        description: The model for diagnosis. Empty uses Claude Code's default.
        type: string
        default: ""
      claude-version:
        description: The Claude Code version to install (stable, latest or a version).
        type: string
        default: stable
      dry-run:
        description: auto (a dry run anywhere but the default branch), always or never.
        type: string
        default: auto
      timeout-minutes:
        description: For each hunt and diagnose job.
        type: number
        default: 60
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: From `claude setup-token`. Without it (or ANTHROPIC_API_KEY), issues go out without a diagnosis.
        required: false
      ANTHROPIC_API_KEY:
        required: false
    outputs:
      flaky-count:
        description: How many tests failed some runs but not all.
        value: ${{ jobs.triage.outputs.flaky-count }}
      broken-count:
        description: How many tests failed every run.
        value: ${{ jobs.triage.outputs.broken-count }}

permissions: {}

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      name: ${{ steps.plan.outputs.name }}
      shards: ${{ steps.plan.outputs.shards }}
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
    steps:
      - name: Check the inputs
        id: plan
        env:
          TOOLS_REPO: ${{ job.workflow_repository }}
          TOOLS_SHA: ${{ job.workflow_sha }}
          SHARDS: ${{ inputs.shards }}
          RUNS: ${{ inputs.runs-per-shard }}
          ID: ${{ inputs.id }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [ -z "$TOOLS_SHA" ] || [ -z "$TOOLS_REPO" ]; then
            echo "::error::job.workflow_sha is empty. The runner is too old to say which commit of the flake-hunt workflow is running."
            exit 1
          fi
          for n in "$SHARDS" "$RUNS"; do
            case "$n" in '' | *[!0-9]*) echo "::error::shards and runs-per-shard must be whole numbers"; exit 1 ;; esac
          done
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 50 ]; then echo "::error::shards must be 1 to 50"; exit 1; fi
          if [ "$RUNS" -lt 1 ]; then echo "::error::runs-per-shard must be at least 1"; exit 1; fi
          name=$ID
          if [ -z "$name" ]; then
            name=$(printf '%s' "$WORKING_DIRECTORY" | sed -e 's#^\./##' -e 's#/*$##' -e 's#[^A-Za-z0-9._-]#-#g')
            if [ -z "$name" ] || [ "$name" = . ]; then name=root; fi
          fi
          shards="[$(seq -s, 1 "$SHARDS")]"
          echo "Hunt $name: $SHARDS shards of $RUNS runs, with $TOOLS_REPO@$TOOLS_SHA"
          {
            echo "name=$name"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .flake-hunt
          persist-credentials: false
      - name: Pick the Elixir and OTP versions
        id: versions
        env:
          FLAKE_HUNT_ELIXIR: ${{ inputs.elixir-version }}
          FLAKE_HUNT_OTP: ${{ inputs.otp-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .flake-hunt/flake-hunt/run/versions.sh "$WORKING_DIRECTORY" .

  hunt:
    needs: plan
    name: hunt (${{ matrix.shard }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .flake-hunt
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.plan.outputs.elixir }}
          otp-version: ${{ needs.plan.outputs.otp }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: flake-hunt-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.name }}-${{ needs.plan.outputs.elixir }}-${{ needs.plan.outputs.otp }}-${{ hashFiles(format('{0}/mix.lock', inputs.working-directory)) }}
      - name: Setup
        if: inputs.setup != ''
        env:
          FLAKE_HUNT_SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$FLAKE_HUNT_SETUP"
      - run: mix deps.get
      - run: mix compile
      - name: Hunt
        env:
          FLAKE_HUNT_RUNS: ${{ inputs.runs-per-shard }}
          FLAKE_HUNT_SHARD: ${{ matrix.shard }}
          FLAKE_HUNT_OUT: ${{ runner.temp }}/flake-hunt/shard-${{ matrix.shard }}.jsonl
          FLAKE_HUNT_TEST_ARGS: ${{ inputs.test-args }}
        run: bash "$GITHUB_WORKSPACE/.flake-hunt/flake-hunt/run/hunt.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: flake-hunt-${{ needs.plan.outputs.name }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/flake-hunt/
          retention-days: 7
          if-no-files-found: ignore

  triage:
    needs: [plan, hunt]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      flaky-count: ${{ steps.triage.outputs.flaky-count }}
      broken-count: ${{ steps.triage.outputs.broken-count }}
      diagnose-count: ${{ steps.triage.outputs.diagnose-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .flake-hunt
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flake-hunt-${{ needs.plan.outputs.name }}-shard-*
          path: ${{ runner.temp }}/results
      - id: triage
        uses: ./.flake-hunt/flake-hunt/triage
        with:
          results: ${{ runner.temp }}/results
          out: ${{ runner.temp }}/triage
          working-directory: ${{ inputs.working-directory }}
          label: ${{ inputs.label }}
          max-diagnoses: ${{ inputs.max-diagnoses }}
          can-diagnose: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-hunt-${{ needs.plan.outputs.name }}-triage
          path: ${{ runner.temp }}/triage/
          retention-days: 7

  # Claude runs the tests, so this job sets up like a hunt shard. It gets a
  # read-only token and no credentials in the checkout.
  diagnose:
    needs: [plan, triage]
    if: ${{ !cancelled() && needs.triage.outputs.diagnose-count != '' && needs.triage.outputs.diagnose-count != '0' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .flake-hunt
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.plan.outputs.elixir }}
          otp-version: ${{ needs.plan.outputs.otp }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: flake-hunt-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.name }}-${{ needs.plan.outputs.elixir }}-${{ needs.plan.outputs.otp }}-${{ hashFiles(format('{0}/mix.lock', inputs.working-directory)) }}
      - name: Setup
        if: inputs.setup != ''
        env:
          FLAKE_HUNT_SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$FLAKE_HUNT_SETUP"
      - run: mix deps.get
      - run: mix compile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-hunt-${{ needs.plan.outputs.name }}-triage
          path: ${{ runner.temp }}/triage
      - name: Install Claude Code
        env:
          CLAUDE_VERSION: ${{ inputs.claude-version }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Diagnose
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLAKE_HUNT_MODEL: ${{ inputs.claude-model }}
        run: bash "$GITHUB_WORKSPACE/.flake-hunt/flake-hunt/diagnose/diagnose.sh" "$RUNNER_TEMP/triage/prompts" "$RUNNER_TEMP/diagnoses"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: flake-hunt-${{ needs.plan.outputs.name }}-diagnoses
          path: ${{ runner.temp }}/diagnoses/
          retention-days: 7
          if-no-files-found: ignore

  report:
    needs: [plan, triage, diagnose]
    if: ${{ !cancelled() && needs.triage.result == 'success' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .flake-hunt
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-hunt-${{ needs.plan.outputs.name }}-triage
          path: ${{ runner.temp }}/triage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.diagnose.result != 'skipped'
        continue-on-error: true
        with:
          name: flake-hunt-${{ needs.plan.outputs.name }}-diagnoses
          path: ${{ runner.temp }}/diagnoses
      - uses: ./.flake-hunt/flake-hunt/report
        with:
          triage: ${{ runner.temp }}/triage
          diagnoses: ${{ runner.temp }}/diagnoses
          label: ${{ inputs.label }}
          dry-run: ${{ inputs.dry-run }}
